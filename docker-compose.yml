version: '3.8'

services:
  # StrideClub Application (Express + Vite Server)
  strideclub-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strideclub-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-running-club-secure-vault-key-2026}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/strideclub
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      - postgres

  # PostgreSQL Database (Supabase / Cloud SQL local drop-in compatible)
  postgres:
    image: postgres:16-alpine
    container_name: strideclub-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=strideclub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
